<title>현장견학 출석 체크</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2313252f'/%3E%3Cpath d='M17 33l10 10 21-23' fill='none' stroke='%23d8ff67' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap');
:root{font-family:'Noto Sans KR',system-ui,sans-serif;color:#15242b;background:#edf1ed;--ink:#13252f;--lime:#d8ff67;--mint:#bde9d1;--orange:#ffba7b;--red:#ff9a91}*{box-sizing:border-box}body{margin:0;min-height:100vh}button,input{font:inherit}button{cursor:pointer}.shell{max-width:760px;margin:auto;min-height:100vh;background:#f6f7f3;box-shadow:0 0 50px #13252f18}.mast{position:sticky;top:0;z-index:10;background:var(--ink);color:#fff;padding:14px 16px 12px;border-radius:0 0 24px 24px;box-shadow:0 7px 24px #13252f33}.brand{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand small{color:#b8c6c7;font-weight:700;letter-spacing:.04em}.brand b{font-size:1.08rem}.dates{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:13px}.date-tab{border:1px solid #52636a;background:#203842;color:#d9e2e2;border-radius:14px;padding:12px 8px;font-weight:800}.date-tab.active{background:var(--lime);color:var(--ink);border-color:var(--lime)}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:10px}.stat{background:#203842;border-radius:11px;padding:8px 5px;text-align:center}.stat strong{display:block;font-size:1.15rem;line-height:1.1}.stat span{font-size:.72rem;color:#cbd5d4}.stat.present strong{color:var(--lime)}.stat.excused strong{color:var(--orange)}.stat.absent strong{color:var(--red)}main{padding:18px 14px 110px}.toolbar{display:grid;grid-template-columns:1fr auto;gap:9px;align-items:center}.search{width:100%;border:1px solid #d7ded9;background:#fff;border-radius:13px;padding:13px 14px;font-size:1rem;outline:none}.search:focus{border-color:#57736a;box-shadow:0 0 0 3px #bde9d166}.menu-btn{border:0;background:var(--ink);color:#fff;border-radius:13px;padding:13px 14px;font-weight:800}.actions{display:flex;gap:8px;overflow:auto;padding:10px 0 3px}.action{white-space:nowrap;border:1px solid #ccd7d0;background:#fff;border-radius:999px;padding:9px 13px;font-size:.84rem;font-weight:800;color:#31464d}.action.primary{background:#def3e7;border-color:#a8d6bb;color:#1f5a3d}.action.danger{color:#94443e}.context{display:flex;justify-content:space-between;gap:12px;align-items:end;margin:18px 2px 10px}.context h1{font-size:1.35rem;letter-spacing:-.04em;margin:0}.context p{margin:2px 0 0;color:#68777a;font-size:.82rem}.save{font-size:.75rem;color:#60706f;font-weight:700}.list{display:grid;gap:10px}.student{background:#fff;border:1px solid #dfe5e0;border-radius:17px;padding:14px;box-shadow:0 3px 10px #1a30220a}.student-top{display:flex;align-items:center;justify-content:space-between;gap:12px}.identity{display:flex;align-items:center;gap:11px}.number{width:35px;height:35px;border-radius:11px;background:#e9eee9;display:grid;place-items:center;font-weight:900;color:#506167}.name{font-size:1.08rem;font-weight:900;letter-spacing:-.03em}.meta{font-size:.75rem;color:#71807f;margin-top:2px}.badge{font-size:.76rem;font-weight:900;padding:6px 9px;border-radius:999px;background:#edf0ed;color:#6f7a7a}.badge.present{background:#dff5c5;color:#365e16}.badge.excused{background:#ffe1c2;color:#824811}.badge.absent{background:#ffd8d4;color:#853630}.choices{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px}.choice{border:1px solid #d8dfda;background:#f7f8f5;border-radius:10px;padding:9px 3px;font-size:.82rem;font-weight:800;color:#5a686b}.choice.active.present{background:#dff5c5;border-color:#a8d46e;color:#2f5f0c}.choice.active.excused{background:#ffe1c2;border-color:#f2b56f;color:#79420e}.choice.active.absent{background:#ffd8d4;border-color:#ec9a92;color:#7c312c}.choice.active.clear{background:#dce6e8;border-color:#9fb2b7;color:#29454c}.empty{text-align:center;padding:40px 15px;color:#748180}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(760px,100%);z-index:11;background:#fff;border-top:1px solid #dce3de;padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr 1fr;gap:9px;box-shadow:0 -5px 18px #13252f18}.bottom button{border:0;border-radius:13px;padding:13px;font-weight:900}.export{background:var(--ink);color:#fff}.copy{background:var(--lime);color:var(--ink)}.toast{position:fixed;left:50%;bottom:86px;transform:translate(-50%,15px);background:#13252f;color:#fff;padding:10px 15px;border-radius:999px;font-size:.85rem;font-weight:800;opacity:0;pointer-events:none;transition:.2s;z-index:30}.toast.show{opacity:1;transform:translate(-50%,0)}@media(min-width:650px){main{padding-left:24px;padding-right:24px}.list{grid-template-columns:1fr 1fr}.mast{padding-left:24px;padding-right:24px}.bottom{padding-left:24px;padding-right:24px}}@media(max-width:380px){.choices{grid-template-columns:repeat(2,1fr)}.stat span{font-size:.66rem}}
</style></head><body><div class="shell">
<header class="mast"><div class="brand"><div><small>KIT · INTERIOR DESIGN</small><br><b>현장견학 출석 체크</b></div><small id="clock"></small></div><div class="dates"><button class="date-tab active" data-date="2026-10-02">10월 2일 · 본과</button><button class="date-tab" data-date="2026-10-03">10월 3일 · 성인반</button></div><div class="summary"><div class="stat"><strong id="total">0</strong><span>전체</span></div><div class="stat present"><strong id="present">0</strong><span>출석</span></div><div class="stat excused"><strong id="excused">0</strong><span>사전 불참</span></div><div class="stat absent"><strong id="absent">0</strong><span>결석</span></div></div></header>
<main><div class="toolbar"><input id="search" class="search" type="search" placeholder="이름 검색" aria-label="학생 이름 검색"><button id="clearSearch" class="menu-btn">지우기</button></div><div class="actions"><button id="allPresent" class="action primary">체크 전 전원 출석</button><button id="showUnmarked" class="action">체크 전만 보기</button><button id="resetDay" class="action danger">이 날짜 초기화</button></div><div class="context"><div><h1 id="dateTitle"></h1><p id="progressText"></p></div><span id="saveState" class="save">자동 저장</span></div><div id="list" class="list"></div></main>
<div class="bottom"><button id="exportCsv" class="export">CSV 저장</button><button id="copySummary" class="copy">결과 복사</button></div><div id="toast" class="toast" role="status"></div></div>
<script>
const roster={"2026-10-02":[{"no":1,"grade":"1","class":"A","name":"강성욱","uid":"A-1"},{"no":2,"grade":"1","class":"A","name":"강영준","uid":"A-2"},{"no":3,"grade":"1","class":"A","name":"강종구","uid":"A-3"},{"no":4,"grade":"1","class":"A","name":"김나영","uid":"A-4"},{"no":5,"grade":"1","class":"A","name":"김다은","uid":"A-5"},{"no":6,"grade":"1","class":"A","name":"김대섭","uid":"A-6"},{"no":7,"grade":"1","class":"A","name":"김민지","uid":"A-7"},{"no":8,"grade":"1","class":"A","name":"김서우","uid":"A-8"},{"no":9,"grade":"1","class":"A","name":"김현우","uid":"A-9"},{"no":10,"grade":"1","class":"A","name":"박민서","uid":"A-10"},{"no":11,"grade":"1","class":"A","name":"배준석","uid":"A-11"},{"no":12,"grade":"1","class":"A","name":"심서량","uid":"A-12"},{"no":13,"grade":"1","class":"A","name":"안다빈","uid":"A-13"},{"no":14,"grade":"1","class":"A","name":"유준렬","uid":"A-14"},{"no":15,"grade":"1","class":"A","name":"이가은","uid":"A-15"},{"no":16,"grade":"1","class":"A","name":"이진","uid":"A-16"},{"no":17,"grade":"1","class":"A","name":"이해주","uid":"A-17"},{"no":18,"grade":"1","class":"A","name":"이현성","uid":"A-18"},{"no":19,"grade":"1","class":"A","name":"이효진","uid":"A-19"},{"no":20,"grade":"1","class":"A","name":"정민준","uid":"A-20"},{"no":21,"grade":"1","class":"A","name":"최진혁","uid":"A-21"},{"no":22,"grade":"1","class":"A","name":"추수빈","uid":"A-22"},{"no":23,"grade":"1","class":"A","name":"허정","uid":"A-23"},{"no":24,"grade":"1","class":"A","name":"정연지","uid":"A-24"},{"no":25,"grade":"2","class":"A","name":"간툴가 엔흐진","uid":"A-25"},{"no":26,"grade":"2","class":"A","name":"강혜원","uid":"A-26"},{"no":27,"grade":"2","class":"A","name":"고무선","uid":"A-27"},{"no":28,"grade":"2","class":"A","name":"김동준","uid":"A-28"},{"no":29,"grade":"2","class":"A","name":"김수호","uid":"A-29"},{"no":30,"grade":"2","class":"A","name":"박솔","uid":"A-30"},{"no":31,"grade":"2","class":"A","name":"박재성","uid":"A-31"},{"no":32,"grade":"2","class":"A","name":"박정태","uid":"A-32"},{"no":33,"grade":"2","class":"A","name":"박진성","uid":"A-33"},{"no":34,"grade":"2","class":"A","name":"밧사이칸 문흐 우츠랄","uid":"A-34"},{"no":35,"grade":"2","class":"A","name":"송승준","uid":"A-35"},{"no":36,"grade":"2","class":"A","name":"염지원","uid":"A-36"},{"no":37,"grade":"2","class":"A","name":"유태호","uid":"A-37"},{"no":38,"grade":"2","class":"A","name":"이지현","uid":"A-38"},{"no":39,"grade":"2","class":"A","name":"임수빈","uid":"A-39"},{"no":40,"grade":"2","class":"A","name":"임진욱","uid":"A-40"},{"no":41,"grade":"2","class":"A","name":"조신영","uid":"A-41"},{"no":42,"grade":"2","class":"A","name":"최수은","uid":"A-42"}],"2026-10-03":[{"no":1,"grade":"1","class":"I","name":"김민수","uid":"I-1"},{"no":2,"grade":"1","class":"I","name":"김유진","uid":"I-2"},{"no":3,"grade":"1","class":"I","name":"김휘근","uid":"I-3"},{"no":4,"grade":"1","class":"I","name":"유동현","uid":"I-4"},{"no":5,"grade":"1","class":"I","name":"임승민","uid":"I-5"},{"no":6,"grade":"1","class":"I","name":"정성훈","uid":"I-6"},{"no":7,"grade":"2","class":"I","name":"고홍희","uid":"I-7"},{"no":8,"grade":"2","class":"I","name":"김도경","uid":"I-8"},{"no":9,"grade":"2","class":"I","name":"김미연","uid":"I-9"},{"no":10,"grade":"2","class":"I","name":"김재용","uid":"I-10"},{"no":11,"grade":"2","class":"I","name":"김헌태","uid":"I-11"},{"no":12,"grade":"2","class":"I","name":"박윤희","uid":"I-12"},{"no":13,"grade":"2","class":"I","name":"박진헌","uid":"I-13"},{"no":14,"grade":"2","class":"I","name":"유유리","uid":"I-14"},{"no":15,"grade":"2","class":"I","name":"이옥순","uid":"I-15"},{"no":16,"grade":"2","class":"I","name":"이현석","uid":"I-16"},{"no":17,"grade":"2","class":"I","name":"이희정","uid":"I-17"},{"no":18,"grade":"2","class":"I","name":"장서원","uid":"I-18"},{"no":19,"grade":"2","class":"I","name":"정대환","uid":"I-19"},{"no":20,"grade":"2","class":"I","name":"정성혁","uid":"I-20"},{"no":21,"grade":"2","class":"I","name":"허성호","uid":"I-21"}]};
const labels={present:'출석',excused:'사전 불참',absent:'불참',clear:'체크 전'};
const initialStatuses={'2026-10-02':{'A-5':'excused','A-7':'excused','A-18':'excused','A-19':'excused','A-24':'excused'}};
let day='2026-10-02',onlyUnmarked=false;
const key='kit-fieldtrip-attendance-2026-v2';
let state={};try{state=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){state={}}
const $=id=>document.getElementById(id);
function record(id){const saved=state[day]?.[id];if(saved?.status==='late')return {status:'clear',time:''};return saved||{status:initialStatuses[day]?.[id]||'clear',time:''}}
function persist(){localStorage.setItem(key,JSON.stringify(state));$('saveState').textContent='저장됨 · '+new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'});}
function setStatus(id,status){state[day]??={};state[day][id]={status,time:status==='clear'?'':new Date().toISOString()};persist();render();}
function counts(){const arr=roster[day],c={present:0,excused:0,absent:0,clear:0};arr.forEach(s=>c[record(s.uid).status]++);return c}
function render(){document.querySelectorAll('.date-tab').forEach(b=>b.classList.toggle('active',b.dataset.date===day));const arr=roster[day],c=counts();$('total').textContent=arr.length;$('present').textContent=c.present;$('excused').textContent=c.excused;$('absent').textContent=c.absent;$('dateTitle').textContent=day==='2026-10-02'?'10월 2일 본과':'10월 3일 성인반';$('progressText').textContent=`확인 ${arr.length-c.clear}명 · 체크 전 ${c.clear}명`;$('showUnmarked').textContent=onlyUnmarked?'전체 보기':'체크 전만 보기';const q=$('search').value.trim();const filtered=arr.filter(s=>(!q||s.name.includes(q))&&(!onlyUnmarked||record(s.uid).status==='clear'));$('list').innerHTML=filtered.map(s=>{const r=record(s.uid);return `<article class="student"><div class="student-top"><div class="identity"><span class="number">${s.no}</span><div><div class="name">${s.name}</div><div class="meta">${s.grade}학년</div></div></div><span class="badge ${r.status}">${labels[r.status]}</span></div><div class="choices">${['present','excused','absent','clear'].map(v=>`<button class="choice ${v} ${r.status===v?'active':''}" data-id="${s.uid}" data-status="${v}">${labels[v]}</button>`).join('')}</div></article>`}).join('')||'<div class="empty">조건에 맞는 학생이 없습니다.</div>';document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>setStatus(b.dataset.id,b.dataset.status));}
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1600)}
document.querySelectorAll('.date-tab').forEach(b=>b.onclick=()=>{day=b.dataset.date;onlyUnmarked=false;$('search').value='';render()});$('search').oninput=render;$('clearSearch').onclick=()=>{$('search').value='';render()};$('showUnmarked').onclick=()=>{onlyUnmarked=!onlyUnmarked;render()};$('allPresent').onclick=()=>{state[day]??={};roster[day].forEach(s=>{if(record(s.uid).status==='clear')state[day][s.uid]={status:'present',time:new Date().toISOString()}});persist();render();toast('체크 전 학생을 출석 처리했습니다')};$('resetDay').onclick=()=>{if(confirm(`${$('dateTitle').textContent} 기록을 모두 초기화할까요?`)){delete state[day];persist();render();toast('초기화했습니다')}};
$('exportCsv').onclick=()=>{const rows=[['날짜','구분','번호','학년','이름','상태','확인시각'],...roster[day].map(s=>{const r=record(s.uid);return[day,day==='2026-10-02'?'본과':'성인반',s.no,s.grade,s.name,labels[r.status],r.time?new Date(r.time).toLocaleString('ko-KR'):'']})];const csv='﻿'+rows.map(row=>row.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=`현장견학_출석_${day}.csv`;a.click();URL.revokeObjectURL(a.href);toast('CSV 파일을 저장했습니다')};
$('copySummary').onclick=async()=>{const c=counts();const by=v=>roster[day].filter(s=>record(s.uid).status===v).map(s=>s.name).join(', ')||'없음';const text=`[${$('dateTitle').textContent} 출석 현황]
전체 ${roster[day].length}명 / 출석 ${c.present}명 / 사전 불참 ${c.excused}명 / 불참 ${c.absent}명 / 체크 전 ${c.clear}명

사전 불참: ${by('excused')}
불참: ${by('absent')}
체크 전: ${by('clear')}`;await navigator.clipboard.writeText(text);toast('출석 현황을 복사했습니다')};
function tick(){$('clock').textContent=new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'})}tick();setInterval(tick,30000);render();
</script></body></html>
